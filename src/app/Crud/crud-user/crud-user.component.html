<div class="p-4">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Gestion des Utilisateurs</h2>

  <div class="overflow-x-auto rounded-lg shadow">
    <table class="min-w-full bg-white">
      <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prénom</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rôle</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
      <tr *ngFor="let user of utilisateurs" class="hover:bg-gray-50 transition-colors">
        <td class="px-6 py-4 whitespace-nowrap">{{ user.nom }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ user.prenom }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ user.email }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
              {{ user.role }}
            </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <button
            (click)="deleteUser(user.id)"
            class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors"
          >
            Supprimer
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
