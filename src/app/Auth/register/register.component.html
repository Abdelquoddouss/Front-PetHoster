<section class="min-h-screen flex items-center justify-center px-6 py-12 relative overflow-hidden">
  <!-- Image de fond optimisée -->
  <picture>
    <source srcset="assets/img/istockphoto-1417882544-612x612.jpg" type="image/webp">
    <source srcset="assets/img/istockphoto-1417882544-612x612.jpg" type="image/jpeg">
    <img src="assets/img/istockphoto-1417882544-612x612.jpg" alt="Groupe d'animaux de compagnie" class="absolute inset-0 w-full h-full object-cover">
  </picture>

  <!-- Overlay sombre pour améliorer la lisibilité -->
  <div class="bg-black/60 absolute inset-0"></div>

  <!-- Conteneur du formulaire -->
  <div class="relative z-10 max-w-xl w-full bg-white/90 backdrop-blur-md shadow-2xl rounded-lg p-8 transform transition-all hover:shadow-3xl hover:-translate-y-2">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-4">Inscription</h2>
    <p class="text-gray-600 text-center mb-8">Rejoignez-nous en quelques étapes simples.</p>

    <form >
      <!-- Nom -->
      <div class="mb-6">
        <label for="nom" class="block text-gray-700 font-medium mb-2">Nom</label>
        <input type="text" id="nom" name="nom" required minlength="2" maxlength="50"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="Entrez votre nom">
      </div>

      <!-- Prénom -->
      <div class="mb-6">
        <label for="prenom" class="block text-gray-700 font-medium mb-2">Prénom</label>
        <input type="text" id="prenom" name="prenom" required minlength="2" maxlength="50"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="Entrez votre prénom">
      </div>

      <!-- Email -->
      <div class="mb-6">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="exemple@mail.com">
      </div>

      <!-- Mot de passe -->
      <div class="mb-6">
        <label for="motDePasse" class="block text-gray-700 font-medium mb-2">Mot de passe</label>
        <input type="password" id="motDePasse" name="motDePasse" required minlength="8"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="••••••••">
      </div>

      <!-- Téléphone -->
      <div class="mb-6">
        <label for="telephone" class="block text-gray-700 font-medium mb-2">Téléphone</label>
        <input type="text" id="telephone" name="telephone" required pattern="[0-9]{10}"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="0123456789">
      </div>

      <!-- Adresse -->
      <div class="mb-6">
        <label for="adresse" class="block text-gray-700 font-medium mb-2">Adresse</label>
        <input type="text" id="adresse" name="adresse" required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
               placeholder="Entrez votre adresse">
      </div>

      <!-- Bouton d'inscription -->
      <button type="submit"
              class="w-full bg-gradient-to-r from-blue-300 to-blue-200 text-gray-800 px-6 py-3 rounded-lg font-semibold hover:from-blue-400 hover:to-blue-300 transition transform hover:scale-105 active:scale-95">
        S'inscrire
      </button>
    </form>

    <!-- Lien vers la connexion -->
    <p class="text-center text-gray-600 mt-6">
      Déjà inscrit ? <a href="/login" class="text-blue-600 hover:underline">Connectez-vous ici</a>
    </p>
  </div>
</section>
