<div class="min-h-screen bg-gray-50 py-20 flex items-center justify-center">
  <div class="max-w-4xl w-full mx-auto px-8">
    <div class="bg-white shadow-2xl rounded-2xl p-12">
      <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-800">Créer un service d'hébergement</h1>
        <p class="text-gray-600 mt-4 text-lg">Veuillez remplir tous les champs pour enregistrer votre service d'hébergement.</p>
      </div>

      <form [formGroup]="hebergementForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
        <div class="space-y-10">
          <!-- Tarif par jour -->
          <div>
            <label for="tarifParJour" class="block text-lg font-medium text-gray-700 mb-3">Tarif par jour (€)</label>
            <input type="number" id="tarifParJour" formControlName="tarifParJour"
                   class="mt-1 block w-full px-6 py-4 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 sm:text-lg"
                   min="0" step="0.01" required>
          </div>

          <!-- Description du service -->
          <div>
            <label for="descriptionService" class="block text-lg font-medium text-gray-700 mb-3">Description de votre service</label>
            <textarea id="descriptionService" formControlName="descriptionService" rows="6"
                      class="mt-1 block w-full px-6 py-4 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 sm:text-lg"
                      required></textarea>
          </div>

          <!-- Types d'animaux acceptés -->
          <div>
            <label class="block text-lg font-medium text-gray-700 mb-4">Types d'animaux acceptés</label>
            <div class="mt-3 grid grid-cols-2 md:grid-cols-3 gap-5">
              <div *ngFor="let animal of typeAnimauxOptions" class="flex items-center bg-gray-50 p-5 rounded-xl hover:bg-gray-100 transition duration-200">
                <input type="checkbox" [id]="'animal_' + animal.id" [value]="animal.id"
                       (change)="onAnimalTypeChange($event)"
                       class="h-6 w-6 text-blue-600 border-2 border-gray-300 rounded-lg focus:ring-blue-500 transition duration-200">
                <label [for]="'animal_' + animal.id" class="ml-4 text-lg text-gray-700 font-medium">{{ animal.animalType }}</label>
              </div>
            </div>
          </div>

          <!-- Photos de l'hébergement -->
          <div>
            <label class="block text-lg font-medium text-gray-700 mb-4">Photos de l'hébergement (maximum 3)</label>
            <div class="mt-3 space-y-6">
              <div *ngFor="let i of [0, 1, 2]" class="flex items-center space-x-5">
                <input type="file" (change)="onFileSelected($event, i)" accept="image/*"
                       class="block w-full text-lg text-gray-500 file:mr-5 file:py-4 file:px-8 file:rounded-xl file:border-0 file:text-lg file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition duration-200">
                <span *ngIf="selectedFiles[i]" class="text-lg text-green-600">{{ selectedFiles[i].name }}</span>
              </div>
            </div>
          </div>

          <!-- Boutons de soumission -->
          <div class="flex justify-end space-x-6 mt-12">
            <button type="button" class="bg-gray-300 hover:bg-gray-400 text-black font-bold py-4 px-8 rounded-xl transition duration-200">
              Annuler
            </button>
            <button type="submit" [disabled]="isSubmitting"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-xl transition duration-200">
              <span *ngIf="!isSubmitting">Enregistrer</span>
              <span *ngIf="isSubmitting">Traitement en cours...</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
