<!-- component -->
<div class="min-h-screen p-6 bg-gray-100 flex items-center justify-center">
  <div class="container max-w-screen-lg mx-auto">
    <div>
      <div class="bg-white rounded shadow-lg p-4 px-4 md:p-8 mb-6">
        <div class="grid gap-4 gap-y-2 text-sm grid-cols-1 lg:grid-cols-3">
          <div class="text-gray-600">
            <p class="font-medium text-lg">Hebergement</p>
            <p>Veuillez remplir tous les champs pour enregistrer votre service d'hébergement.</p>
          </div>

          <div class="lg:col-span-2">
            <form [formGroup]="hebergementForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
              <div class="grid gap-4 gap-y-2 text-sm grid-cols-1 md:grid-cols-5">
                <!-- Nouveaux champs à ajouter -->
                <div class="md:col-span-2">
                  <label for="tarifParJour">Tarif par jour (€)</label>
                  <input type="number" name="tarifParJour" id="tarifParJour" formControlName="tarifParJour" class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" min="0" step="0.01" />
                </div>

                <div class="md:col-span-5">
                  <label for="descriptionService">Description de votre service</label>
                  <textarea name="descriptionService" id="descriptionService" formControlName="descriptionService" rows="4" class="border mt-1 rounded px-4 w-full bg-gray-50"></textarea>
                </div>

                <div class="md:col-span-5">
                  <label>Types d'animaux acceptés</label>
                  <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-1">
                    <div *ngFor="let animal of typeAnimauxOptions" class="flex items-center">
                      <input type="checkbox"
                             [id]="'animal_' + animal.id"
                             [value]="animal.id"
                             (change)="onAnimalTypeChange($event)"
                             class="form-checkbox h-5 w-5 text-blue-600" />
                      <label [for]="'animal_' + animal.id" class="ml-2">{{ animal.animalType }}</label>
                    </div>
                  </div>
                </div>

                <div class="md:col-span-5">
                  <label class="block mb-2">Photos de l'hébergement (maximum 3)</label>
                  <div class="flex flex-col space-y-2">
                    <div class="flex items-center space-x-2">
                      <input type="file" (change)="onFileSelected($event, 0)" accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100" />
                      <span *ngIf="selectedFiles[0]" class="text-sm text-green-600">{{ selectedFiles[0].name }}</span>
                    </div>

                    <div class="flex items-center space-x-2">
                      <input type="file" (change)="onFileSelected($event, 1)" accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100" />
                      <span *ngIf="selectedFiles[1]" class="text-sm text-green-600">{{ selectedFiles[1].name }}</span>
                    </div>

                    <div class="flex items-center space-x-2">
                      <input type="file" (change)="onFileSelected($event, 2)" accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100" />
                      <span *ngIf="selectedFiles[2]" class="text-sm text-green-600">{{ selectedFiles[2].name }}</span>
                    </div>
                  </div>
                </div>

                <div class="md:col-span-5 text-right mt-4">
                  <div class="inline-flex items-end">
                    <button type="button" class="bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded mr-2">
                      Annuler
                    </button>
                    <button type="submit" [disabled]="isSubmitting" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                      <span *ngIf="!isSubmitting">Enregistrer</span>
                      <span *ngIf="isSubmitting">Traitement en cours...</span>
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
