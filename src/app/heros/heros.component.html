<section class='search-hero'><div class='hero-backdrop'></div><div class='hero-content'><div class='hero-copy'><span class='eyebrow light'><span></span> Une garde de confiance, pres de chez vous</span><h1>Le meilleur sejour pour votre <em>meilleur ami.</em></h1><p>Decouvrez des hebergeurs attentionnes qui accueilleront votre compagnon comme un membre de leur famille.</p><div class='trust-row'><div class='avatars'><img src='assets/img/person_1.jpg' alt=''><img src='assets/img/person_2.jpg' alt=''><img src='assets/img/person_3.jpg' alt=''></div><div><strong>4,9/5</strong><span>par notre communaute</span></div></div></div><form [formGroup]='searchForm' (ngSubmit)='onSearch()' class='search-panel'><div class='search-panel-head'><span class='search-icon'>S</span><div><strong>Trouvez votre hebergeur</strong><span>Une recherche simple et rapide</span></div></div><div class='search-grid'><label><span>Localisation</span><input type='text' placeholder='Casablanca, Rabat...' formControlName='localisation'></label><label><span>Votre animal</span><select formControlName='typeAnimauxIds'><option [ngValue]='null'>Tous les animaux</option><option *ngFor='let type of typeAnimaux' [ngValue]='type.id'>{{ type.animalType }}</option></select></label><label><span>Budget / jour</span><input type='number' placeholder='Prix maximum' formControlName='tarifMaxParJour'></label><button type='submit' class='btn-primary search-submit'>Rechercher</button></div><div class='popular-types' *ngIf='typeAnimauxPopulaires.length'><span>Populaires :</span><button type='button' *ngFor='let type of typeAnimauxPopulaires' (click)='selectionnerTypeAnimal(type)'>{{ type.animalType }}</button></div></form></div></section>
