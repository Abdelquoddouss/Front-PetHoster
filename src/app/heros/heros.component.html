<div class="relative w-full h-screen bg-cover bg-center" style="background-image: url('assets/img/image_6.jpg');">
  <!-- Overlay pour améliorer la lisibilité du texte -->
  <div class="absolute inset-0 bg-black bg-opacity-60"></div>

  <!-- Contenu principal centré -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full text-center text-white px-6">
    <!-- Titre principal -->
    <h1 class="text-5xl md:text-6xl font-bold mb-4 animate-fade-in-up">
      Trouvez le Gardien Parfait
    </h1>
    <!-- Sous-titre -->
    <p class="mt-4 text-lg md:text-xl max-w-2xl animate-fade-in-up delay-100">
      Un service premium de garde d'animaux pour assurer le bien-être de vos compagnons pendant votre absence.
    </p>

    <!-- Barre de recherche -->
    <div class="mt-10 w-full max-w-4xl bg-white/95 backdrop-blur rounded-xl shadow-xl p-6 animate-fade-in-up delay-300">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()" class="flex flex-col md:flex-row gap-4">
        <!-- Localisation -->
        <div class="flex-1">
          <label for="localisation" class="block text-sm font-medium text-gray-700 mb-1">Localisation</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-map-marker-alt text-gray-400"></i>
            </div>
            <input
              id="localisation"
              type="text"
              placeholder="Ville ou code postal"
              formControlName="localisation"
              class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900"
            />
          </div>
        </div>

        <!-- Type d'animal -->
        <div class="flex-1">
          <label for="typeAnimaux" class="block text-sm font-medium text-gray-700 mb-1">Type d'animal</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-paw text-gray-400"></i>
            </div>
            <select
              id="typeAnimaux"
              formControlName="typeAnimauxIds"
              class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 appearance-none"
            >
              <option [ngValue]="null">Tous les animaux</option>
              <option *ngFor="let type of typeAnimaux" [ngValue]="type.id">{{ type.animalType }}</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
              <i class="fas fa-chevron-down text-gray-400"></i>
            </div>
          </div>
        </div>

        <!-- Tarif maximum -->
        <div class="flex-1">
          <label for="tarifMax" class="block text-sm font-medium text-gray-700 mb-1">Budget maximum</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-euro-sign text-gray-400"></i>
            </div>
            <input
              id="tarifMax"
              type="number"
              placeholder="Tarif max par jour"
              formControlName="tarifMaxParJour"
              class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900"
            />
          </div>
        </div>

        <!-- Bouton de recherche -->
        <div class="flex items-end">
          <button
            type="submit"
            class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg flex items-center justify-center transition-all duration-300 shadow-lg hover:shadow-xl"
          >
            <i class="fas fa-search mr-2"></i> Rechercher
          </button>
        </div>
      </form>
    </div>

    <!-- Badges animaux populaires -->
    <div class="mt-6 flex flex-wrap justify-center gap-2 animate-fade-in-up delay-400">
      <span *ngFor="let type of typeAnimauxPopulaires"
            (click)="selectionnerTypeAnimal(type)"
            class="cursor-pointer bg-white/20 hover:bg-white/30 backdrop-blur px-4 py-2 rounded-full text-sm font-medium transition-all">
        {{ type.animalType }}
      </span>
    </div>
  </div>
</div>

<!-- Styles pour les animations -->
<style>
  @keyframes fade-in-up {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fade-in-up 0.5s ease-out forwards;
  }
  .delay-100 {
    animation-delay: 0.1s;
  }
  .delay-200 {
    animation-delay: 0.2s;
  }
  .delay-300 {
    animation-delay: 0.3s;
  }
  .delay-400 {
    animation-delay: 0.4s;
  }
</style>
